<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Passwort zurücksetzen | Kinopolis Automation</title>
    <link rel="icon" href="./icon.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Outfit:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0a0a0d;
            --surface-color: rgba(20, 20, 25, 0.7);
            --primary-red: #E50914;
            --text-main: #F2F2F2;
            --text-muted: #8E8E93;
        }

        body {
            background: var(--bg-color);
            background-image: radial-gradient(circle at 50% 50%, rgba(229, 9, 20, 0.1) 0%, transparent 100%);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 440px;
            background: var(--surface-color);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 32px;
            padding: 48px 40px;
            text-align: center;
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.6);
        }

        .logo { 
            width: 200px; 
            margin-bottom: 40px; 
            filter: drop-shadow(0 0 15px rgba(229, 9, 20, 0.2));
            /* Remove white background feel */
            border-radius: 12px;
            padding: 10px;
            background: rgba(255, 255, 255, 0.05);
        }
        h1 { font-family: 'Outfit', sans-serif; font-size: 1.75rem; font-weight: 800; margin-bottom: 12px; letter-spacing: -0.02em; }
        p { color: var(--text-muted); font-size: 0.95rem; margin-bottom: 40px; line-height: 1.6; }

        input {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 14px 20px;
            border-radius: 12px;
            color: white;
            font-size: 16px;
            margin-bottom: 20px;
            outline: none;
            transition: all 0.3s;
        }

        input:focus { border-color: var(--primary-red); background: rgba(229, 9, 20, 0.05); }

        button {
            width: 100%;
            background: var(--primary-red);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 14px;
            font-weight: 800;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 12px;
            box-shadow: 0 10px 20px rgba(229, 9, 20, 0.2);
        }

        button:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(229, 9, 20, 0.4); }
        button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        .status { margin-top: 20px; font-size: 0.9rem; padding: 12px; border-radius: 10px; display: none; }
        .success { display: block; background: rgba(0, 255, 100, 0.1); color: #00ff64; border: 1px solid rgba(0, 255, 100, 0.2); }
        .error { display: block; background: rgba(255, 0, 0, 0.1); color: #ff3d47; border: 1px solid rgba(255, 0, 0, 0.2); }
    </style>
</head>
<body>
    <div class="container" id="reset-container">
        <img src="https://trailer.kinopolis.de/media/img/logos/kinopolis.png" alt="Kinopolis" class="logo">
        <h1>Neues Passwort</h1>
        <p>Gib dein neues Passwort ein, um deinen Account wieder freizuschalten.</p>
        
        <input type="password" id="new-password" placeholder="Neues Passwort" required>
        <input type="password" id="confirm-password" placeholder="Passwort bestätigen" required>
        
        <button id="submit-btn" onclick="handleReset()">Passwort speichern</button>
        <div id="status-msg" class="status"></div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        if (!token) {
            document.body.innerHTML = '<div class="container"><h1 style="color:#ff3d47">Ungültiger Link</h1><p>Der Passwort-Reset-Link ist ungültig oder wurde bereits benutzt.</p><a href="/" style="color:white;text-decoration:none;font-weight:800;">Zurück zum Login</a></div>';
        }

        async function handleReset() {
            const pass = document.getElementById('new-password').value;
            const confirm = document.getElementById('confirm-password').value;
            const btn = document.getElementById('submit-btn');
            const status = document.getElementById('status-msg');

            if (pass.length < 6) {
                showStatus('Passwort muss mindestens 6 Zeichen haben', 'error');
                return;
            }
            if (pass !== confirm) {
                showStatus('Passwörter stimmen nicht überein', 'error');
                return;
            }

            btn.disabled = true;
            btn.innerText = 'Speichern...';

            try {
                const res = await fetch('/api/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, newPassword: pass })
                });
                
                if (res.ok) {
                    showStatus('Erfolgreich! Du kannst dich jetzt einloggen.', 'success');
                    btn.style.display = 'none';
                    setTimeout(() => window.location.href = '/', 3000);
                } else {
                    const data = await res.json();
                    showStatus(data.error || 'Fehler beim Speichern', 'error');
                    btn.disabled = false;
                    btn.innerText = 'Passwort speichern';
                }
            } catch (e) {
                showStatus('Netzwerkfehler', 'error');
                btn.disabled = false;
                btn.innerText = 'Passwort speichern';
            }
        }

        function showStatus(msg, type) {
            const status = document.getElementById('status-msg');
            status.innerText = msg;
            status.className = 'status ' + type;
            status.style.display = 'block';
        }
    </script>
</body>
</html>
