<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Passwort zurücksetzen | Kinopolis Automation</title>
    <link rel="icon" href="./icon.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Outfit:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0a0a0d;
            --surface-color: rgba(20, 20, 25, 0.75);
            --primary-red: #E50914;
            --text-main: #F2F2F2;
            --text-muted: #8E8E93;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--bg-color);
            background-image: radial-gradient(ellipse at 50% 0%, rgba(229, 9, 20, 0.12) 0%, transparent 60%);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: var(--surface-color);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 28px;
            padding: 48px 36px 40px;
            text-align: center;
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.6);
        }

        .logo-wrapper {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.92);
            border-radius: 16px;
            padding: 12px 20px;
            margin-bottom: 36px;
        }

        .logo {
            width: 140px;
            display: block;
        }

        h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 1.75rem;
            font-weight: 800;
            margin-bottom: 12px;
            letter-spacing: -0.02em;
            color: #fff;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 0.93rem;
            margin-bottom: 36px;
            line-height: 1.6;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 15px 20px;
            border-radius: 14px;
            color: white;
            font-size: 16px;
            font-family: 'Inter', sans-serif;
            outline: none;
            transition: all 0.25s;
        }

        input::placeholder { color: var(--text-muted); }
        input:focus { border-color: var(--primary-red); background: rgba(229, 9, 20, 0.06); }

        button {
            width: 100%;
            background: linear-gradient(135deg, #e50914, #ff3d47);
            color: white;
            border: none;
            padding: 17px;
            border-radius: 14px;
            font-weight: 800;
            font-size: 16px;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: all 0.25s;
            box-shadow: 0 8px 20px rgba(229, 9, 20, 0.3);
            margin-top: 6px;
        }

        button:hover { transform: translateY(-2px); box-shadow: 0 12px 28px rgba(229, 9, 20, 0.45); }
        button:active { transform: translateY(0); }
        button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }

        .status {
            margin-top: 18px;
            font-size: 0.88rem;
            padding: 14px 16px;
            border-radius: 12px;
            display: none;
            line-height: 1.5;
        }
        .success { display: block; background: rgba(0, 200, 100, 0.12); color: #2ecc71; border: 1px solid rgba(0, 200, 100, 0.25); }
        .error { display: block; background: rgba(229, 9, 20, 0.1); color: #ff4d4d; border: 1px solid rgba(229, 9, 20, 0.25); }
    </style>
</head>
<body>
    <div class="container" id="reset-container">
        <div class="logo-wrapper">
            <img src="https://trailer.kinopolis.de/media/img/logos/kinopolis.png" alt="Kinopolis" class="logo">
        </div>
        <h1>Neues Passwort</h1>
        <p class="subtitle">Gib dein neues Passwort ein, um deinen Account wieder freizuschalten.</p>
        
        <div class="input-group">
            <input type="password" id="new-password" placeholder="Neues Passwort" required>
            <input type="password" id="confirm-password" placeholder="Passwort bestätigen" required>
        </div>
        
        <button id="submit-btn" onclick="handleReset()">Passwort speichern</button>
        <div id="status-msg" class="status"></div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        // Decode token in case it was URL-encoded
        const token = decodeURIComponent(urlParams.get('token') || '');

        if (!token) {
            document.body.innerHTML = '<div class="container"><h1 style="color:#ff4d4d;margin-bottom:16px;">Ungültiger Link</h1><p style="color:#8E8E93;margin-bottom:28px;">Der Passwort-Reset-Link ist ungültig oder wurde bereits benutzt.</p><a href="/" style="color:#E50914;text-decoration:none;font-weight:800;">→ Zurück zum Login</a></div>';
        }

        async function handleReset() {
            const pass = document.getElementById('new-password').value;
            const confirm = document.getElementById('confirm-password').value;
            const btn = document.getElementById('submit-btn');

            if (pass.length < 6) {
                showStatus('Passwort muss mindestens 6 Zeichen haben', 'error');
                return;
            }
            if (pass !== confirm) {
                showStatus('Passwörter stimmen nicht überein', 'error');
                return;
            }

            btn.disabled = true;
            btn.innerText = 'Speichern...';

            try {
                const res = await fetch('/api/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, newPassword: pass })
                });
                
                if (res.ok) {
                    showStatus('✅ Erfolgreich! Du wirst zum Login weitergeleitet...', 'success');
                    btn.style.display = 'none';
                    setTimeout(() => window.location.href = '/', 2500);
                } else {
                    const data = await res.json();
                    showStatus(data.error || 'Fehler beim Speichern', 'error');
                    btn.disabled = false;
                    btn.innerText = 'Passwort speichern';
                }
            } catch (e) {
                showStatus('Netzwerkfehler', 'error');
                btn.disabled = false;
                btn.innerText = 'Passwort speichern';
            }
        }

        function showStatus(msg, type) {
            const status = document.getElementById('status-msg');
            status.innerText = msg;
            status.className = 'status ' + type;
            status.style.display = 'block';
        }

        // Allow Enter key to submit
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') handleReset();
        });
    </script>
</body>
</html>
