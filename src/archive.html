<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Archiv | Kinopolis</title>
    <link rel="icon" type="image/x-icon" href="https://www.kinopolis.de/favicon.ico">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script type="module" src="auth.js"></script>
    <style>
        :root {
            --bg-color: #0a0a0d;
            --surface-color: rgba(20, 20, 25, 0.7);
            --surface-border: rgba(255, 255, 255, 0.1);
            --text-main: #F2F2F2;
            --text-muted: #8E8E93;
            --primary-blue: #0078FF;
            --accent-blue: #00d2ff;
            --card-radius: 24px;
        }

        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg-color);
            background-image: 
                radial-gradient(circle at 0% 0%, rgba(0, 120, 255, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 100% 100%, rgba(229, 9, 20, 0.05) 0%, transparent 50%);
            color: var(--text-main);
            line-height: 1.5;
            min-height: 100vh;
        }

        h1, h2 { font-family: 'Outfit', sans-serif; }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 3rem 1.5rem;
            width: 100%;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--surface-border);
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .header-title h1 {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, #fff, #aaa);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-title span { font-size: 2rem; }

        .card {
            background: var(--surface-color);
            border: 1px solid var(--surface-border);
            border-radius: 16px;
            padding: 1.5rem;
            margin-bottom: 1rem;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .card:hover { border-color: rgba(255,255,255,0.15); }

        .feed-item {
            padding: 1.25rem;
            background: rgba(255,255,255,0.03);
            border-radius: 12px;
            margin-bottom: 0.75rem;
            border-left: 4px solid var(--text-muted);
        }

        .feed-item.priority-wichtig { border-left-color: #f1c40f; }
        .feed-item.priority-dringend { border-left-color: #e74c3c; background: rgba(231,76,60,0.05); }

        .feed-time { font-size: 0.75rem; color: var(--text-muted); }
        
        .empty-state {
            text-align: center;
            color: var(--text-muted);
            padding: 2rem;
            background: rgba(255,255,255,0.02);
            border-radius: 12px;
            border: 1px dashed var(--surface-border);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary-blue), var(--accent-blue));
            color: white;
            padding: 0.6rem 1.25rem;
            border-radius: 12px;
            cursor: pointer;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.9rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            box-shadow: 0 4px 15px rgba(0, 120, 255, 0.2);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 120, 255, 0.4);
            filter: brightness(1.1);
        }

        .filter-select {
            background: rgba(255, 255, 255, 0.05);
            color: white;
            border: 1px solid var(--surface-border);
            padding: 0.6rem 1rem;
            border-radius: 12px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.3s;
        }

        .filter-select:focus { border-color: var(--primary-blue); }

        .category-bar {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
            overflow-x: auto;
            padding-bottom: 0.5rem;
            -webkit-overflow-scrolling: touch;
        }
        .category-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--surface-border);
            color: var(--text-muted);
            padding: 0.5rem 1rem;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }
        .category-btn.active {
            background: var(--primary-blue);
            color: white;
            border-color: var(--primary-blue);
            box-shadow: 0 4px 12px rgba(0, 120, 255, 0.3);
        }
        .log-image {
            max-width: 100%;
            border-radius: 12px;
            margin-top: 0.5rem;
            border: 1px solid rgba(255,255,255,0.1);
        }
        /* Hidden until Auth */
        body:not(.auth-loaded) > *:not(script):not(style):not(.modal) { display: none !important; }
        #archive-container { display: none; }
        body.auth-loaded #archive-container { display: block; }
    </style>
</head>
<body>
    <div id="archive-container" class="container">
        <header>
            <div class="header-title">
                <span>🗃️</span>
                <h1>Nachrichten-Archiv</h1>
            </div>
            <div>
                <a href="index.html" class="btn-primary">Zurück zum Dashboard</a>
            </div>
        </header>

        <div class="filter-bar" style="margin-bottom: 1.5rem; display: flex; gap: 1rem; align-items: center; flex-wrap: wrap;">
            <select class="filter-select" id="location-select" onchange="loadArchive()">
                <option value="kp">Darmstadt: KINOPOLIS</option>
                <option value="cd">Darmstadt: Citydome</option>
                <option value="rx">Darmstadt: Rex</option>
                <option value="ab">Aschaffenburg: KINOPOLIS</option>
                <option value="bn">Bad Godesberg: KINOPOLIS</option>
                <option value="bh">Bad Homburg: KINOPOLIS</option>
                <option value="fr">Freiberg: KINOPOLIS</option>
                <option value="gi">Gießen: Kinocenter</option>
                <option value="kg">Gießen: KINOPOLIS</option>
                <option value="hh">Hamburg HafenCity: KINOPOLIS</option>
                <option value="hu">Hanau: KINOPOLIS</option>
                <option value="ka">Karlsruhe: Universum-City</option>
                <option value="ko">Koblenz: KINOPOLIS</option>
                <option value="lh">Landshut: KINOPOLIS</option>
                <option value="ro">Rosenheim: KINOPOLIS</option>
                <option value="su">Sulzbach / MTZ: KINOPOLIS</option>
                <option value="vi">Viernheim / RNZ: KINOPOLIS</option>
            </select>
            <button class="btn-primary" onclick="loadArchive()">🔄 Aktualisieren</button>
            <a href="cinemaxx-archiv.html" id="cinemaxx-btn" class="btn-primary" style="margin-left: auto; background: linear-gradient(135deg, #ffb900, #ff8c00); border: none; display: none;">🍿 CinemaxX Archiv</a>
        </div>

        <div class="category-bar">
            <button class="category-btn active" onclick="filterArchive('all', this)">Alle</button>
            <button class="category-btn" onclick="filterArchive('intern', this)">📢 Intern</button>
            <button class="category-btn" onclick="filterArchive('funk', this)">📡 Funk-Ruf</button>
            <button class="category-btn" onclick="filterArchive('transfer', this)">📦 Transfer</button>
            <button class="category-btn" onclick="filterArchive('image', this)">🖼️ Bilder</button>
            <button class="category-btn" onclick="filterArchive('system', this)">📝 Logs</button>
        </div>

        <div class="card">
            <h2 style="font-size: 1.25rem; margin-bottom: 1rem;">Alle archivierten Notizen & Bilder</h2>
            <div id="archive-list">
                <div class="empty-state">Lade Archiv...</div>
            </div>
        </div>
    </div>

    <script>
        let archiveData = [];
        let currentFilter = 'all';
        let currentCity = localStorage.getItem('last_city') || 'kp';
        document.getElementById('location-select').value = currentCity;

        window.addEventListener('load', async () => {
            if (window.AUTH) {
                await AUTH.init();
                document.getElementById('archive-container').style.display = 'block';
                loadArchive();
            }
        });

        function formatTime(isoStr) {
            const date = new Date(isoStr);
            return date.toLocaleDateString('de-DE') + ' ' + date.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
        }

        async function loadArchive() {
            const list = document.getElementById('archive-list');
            list.innerHTML = '<div class="empty-state">Lade Archiv...</div>';
            
            const city = document.getElementById('location-select').value;
            localStorage.setItem('last_city', city); 

            // Show/Hide CinemaxX button only for KP Darmstadt
            const cxBtn = document.getElementById('cinemaxx-btn');
            if (city === 'kp') {
                cxBtn.style.display = 'inline-flex';
            } else {
                cxBtn.style.display = 'none';
            }

            try {
                const [logsRes, msgsRes] = await Promise.all([
                    fetch(`/api/logs?location=${city}`),
                    fetch(`/api/messages/archived?location=${city}`)
                ]);

                if (!logsRes.ok || !msgsRes.ok) throw new Error("Fehler beim Laden");
                
                const logs = await logsRes.json();
                const archivedMsgs = await msgsRes.json();

                archiveData = [
                    ...logs.map(l => ({ ...l, type: 'log' })),
                    ...archivedMsgs.map(m => ({ ...m, type: 'message' }))
                ];

                archiveData.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
                renderArchive();

            } catch (err) {
                list.innerHTML = `<div class="empty-state" style="border-color: #e74c3c; color: #ff8a80;">Fehler beim Laden des Archivs: ${err.message}</div>`;
            }
        }

        function filterArchive(category, btn) {
            currentFilter = category;
            document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderArchive();
        }

        function renderArchive() {
            const list = document.getElementById('archive-list');
            
            let filtered = archiveData;
            if (currentFilter === 'intern') filtered = archiveData.filter(d => d.type === 'message');
            else if (currentFilter === 'funk') filtered = archiveData.filter(d => d.type === 'log' && d.message.includes('[FUNK]'));
            else if (currentFilter === 'transfer') filtered = archiveData.filter(d => d.type === 'log' && d.message.includes('[TRANSFERLISTE]'));
            else if (currentFilter === 'image') filtered = archiveData.filter(d => d.image_url || d.message.includes('http'));
            else if (currentFilter === 'system') filtered = archiveData.filter(d => d.type === 'log' && !d.message.includes('[FUNK]') && !d.message.includes('[TRANSFERLISTE]'));

            if (filtered.length === 0) {
                list.innerHTML = '<div class="empty-state">Keine passenden Einträge gefunden.</div>';
                return;
            }

            list.innerHTML = filtered.map(item => {
                if (item.type === 'message') {
                    return `
                        <div class="feed-item" style="border-left-color: var(--primary-blue); background: rgba(0,120,255,0.05);">
                            <div style="display: flex; justify-content: space-between; margin-bottom: 0.5rem;">
                                <strong>📢 [INTERN] ${item.title}</strong>
                                <span class="feed-time">${formatTime(item.created_at)}</span>
                            </div>
                            <div style="font-size: 0.95rem; white-space: pre-wrap; margin-bottom: 0.5rem;">${item.content}</div>
                            <div style="font-size: 0.8rem; color: var(--text-muted);">Von: ${item.author}</div>
                            ${item.image_url ? `<br><img src="${item.image_url}" class="log-image" loading="lazy">` : ''}
                        </div>
                    `;
                }

                const isFunk = item.message.includes('[FUNK]');
                const isTransfer = item.message.includes('[TRANSFERLISTE]');
                const priorityClass = item.priority ? `priority-${item.priority}` : '';
                let cleanMsg = item.message.replace('[FUNK]', '').replace('[TRANSFERLISTE]', '').replace('[IN_PROGRESS]', '').trim();
                let imgHtml = '';
                
                if (item.image_url) {
                    imgHtml = `<br><img src="${item.image_url}" class="log-image" loading="lazy">`;
                }
                const urlRegex = /(https?:\/\/[^\s]+(?:jpg|jpeg|png|gif|webp))/ig;
                if (cleanMsg.match(urlRegex)) {
                    const urls = cleanMsg.match(urlRegex);
                    if (urls) {
                        for(let url of urls) {
                            imgHtml += `<br><img src="${url}" class="log-image" loading="lazy">`;
                            cleanMsg = cleanMsg.replace(url, `<a href="${url}" target="_blank" style="color:var(--primary-blue);">[Bild Link]</a>`);
                        }
                    }
                }

                let typeEmoji = isFunk ? '📡' : (isTransfer ? '📦' : '📝');

                return `
                    <div class="feed-item ${priorityClass}">
                        <div style="display: flex; justify-content: space-between; margin-bottom: 0.5rem;">
                            <strong>${item.author || 'System'} ${typeEmoji}</strong>
                            <span class="feed-time">${formatTime(item.created_at)}</span>
                        </div>
                        <div style="font-size: 0.95rem; white-space: pre-wrap;">${cleanMsg}</div>
                        ${imgHtml}
                    </div>
                `;
            }).join('');
        }
    </script>
</body>
</html>
