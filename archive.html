<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Archiv | Kinopolis</title>
    <link rel="icon" type="image/x-icon" href="https://www.kinopolis.de/favicon.ico">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0a0a0d;
            --surface-color: rgba(20, 20, 25, 0.7);
            --surface-border: rgba(255, 255, 255, 0.1);
            --text-main: #F2F2F2;
            --text-muted: #8E8E93;
            --primary-blue: #0078FF;
            --accent-blue: #00d2ff;
            --card-radius: 24px;
        }

        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg-color);
            background-image: 
                radial-gradient(circle at 0% 0%, rgba(0, 120, 255, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 100% 100%, rgba(229, 9, 20, 0.05) 0%, transparent 50%);
            color: var(--text-main);
            line-height: 1.5;
            min-height: 100vh;
        }

        h1, h2 { font-family: 'Outfit', sans-serif; }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 3rem 1.5rem;
            width: 100%;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--surface-border);
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .header-title h1 {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, #fff, #aaa);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-title span {
            font-size: 2rem;
        }

        .card {
            background: var(--surface-color);
            border: 1px solid var(--surface-border);
            border-radius: 16px;
            padding: 1.5rem;
            margin-bottom: 1rem;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .card:hover {
            border-color: rgba(255,255,255,0.15);
        }

        .feed-item {
            padding: 1.25rem;
            background: rgba(255,255,255,0.03);
            border-radius: 12px;
            margin-bottom: 0.75rem;
            border-left: 4px solid var(--text-muted);
        }

        .feed-item.priority-wichtig { border-left-color: #f1c40f; }
        .feed-item.priority-dringend { border-left-color: #e74c3c; background: rgba(231,76,60,0.05); }

        .feed-time {
            font-size: 0.75rem;
            color: var(--text-muted);
        }
        
        .empty-state {
            text-align: center;
            color: var(--text-muted);
            padding: 2rem;
            background: rgba(255,255,255,0.02);
            border-radius: 12px;
            border: 1px dashed var(--surface-border);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary-blue), var(--accent-blue));
            color: white;
            padding: 0.6rem 1.25rem;
            border-radius: 12px;
            cursor: pointer;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.9rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            box-shadow: 0 4px 15px rgba(0, 120, 255, 0.2);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 120, 255, 0.4);
            filter: brightness(1.1);
        }

        .filter-select {
            background: rgba(255, 255, 255, 0.05);
            color: white;
            border: 1px solid var(--surface-border);
            padding: 0.6rem 1rem;
            border-radius: 12px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.3s;
        }

        .filter-select:focus {
            border-color: var(--primary-blue);
        }

    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="header-title">
                <span>🗃️</span>
                <h1>Nachrichten-Archiv</h1>
            </div>
            <div>
                <a href="index.html" class="btn-primary">Zurück zum Dashboard</a>
            </div>
        </header>

        <div class="filter-bar">
            <select class="filter-select" id="location-select" onchange="loadArchive()">
                <option value="kp">Darmstadt (KP)</option>
                <option value="cd">Darmstadt (CD)</option>
                <option value="rx">Darmstadt (RX)</option>
                <option value="ab">Aschaffenburg</option>
            </select>
            <button class="btn-primary" onclick="loadArchive()">
                🔄 Aktualisieren
            </button>
            <a href="cinemaxx-archiv.html" class="btn-primary" style="margin-left: auto; background: linear-gradient(135deg, #ffb900, #ff8c00); border: none;">🍿 CinemaxX Archiv (2000-2013)</a>
        </div>

        <div class="card">
            <h2 style="font-size: 1.25rem; margin-bottom: 1rem;">Alle archivierten Notizen & Bilder</h2>
            <div id="archive-list">
                <div class="empty-state">Lade Archiv...</div>
            </div>
        </div>
    </div>

    <script>
        // Check location from localStorage to match user's dashboard setting
        let currentCity = localStorage.getItem('last_city') || 'kp';
        document.getElementById('location-select').value = currentCity;

        window.addEventListener('load', loadArchive);

        function formatTime(isoStr) {
            const date = new Date(isoStr);
            return date.toLocaleDateString('de-DE') + ' ' + date.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
        }

        async function loadArchive() {
            const list = document.getElementById('archive-list');
            list.innerHTML = '<div class="empty-state">Lade Archiv...</div>';
            
            const city = document.getElementById('location-select').value;
            localStorage.setItem('last_city', city); // Sync with other pages

            try {
                // Fetch both Logs and Archived Internal Messages
                const [logsRes, msgsRes] = await Promise.all([
                    fetch(`/api/logs?location=${city}`),
                    fetch(`/api/messages/archived?location=${city}`)
                ]);

                if (!logsRes.ok || !msgsRes.ok) throw new Error("Fehler beim Laden");
                
                const logs = await logsRes.json();
                const archivedMsgs = await msgsRes.json();

                // Combine and sort by date
                let combined = [
                    ...logs.map(l => ({ ...l, type: 'log' })),
                    ...archivedMsgs.map(m => ({ ...m, type: 'message' }))
                ];

                combined.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

                if (combined.length === 0) {
                    list.innerHTML = '<div class="empty-state">Keine Einträge im Archiv gefunden.</div>';
                    return;
                }

                list.innerHTML = combined.map(item => {
                    if (item.type === 'message') {
                        return `
                            <div class="feed-item" style="border-left-color: var(--primary-blue); background: rgba(0,120,255,0.05);">
                                <div style="display: flex; justify-content: space-between; margin-bottom: 0.5rem;">
                                    <strong>📢 [INTERN] ${item.title}</strong>
                                    <span class="feed-time">${formatTime(item.created_at)}</span>
                                </div>
                                <div style="font-size: 0.95rem; white-space: pre-wrap; margin-bottom: 0.5rem;">${item.content}</div>
                                <div style="font-size: 0.8rem; color: var(--text-muted);">Von: ${item.author}</div>
                                ${item.image_url ? `<br><img src="${item.image_url}" class="log-image" loading="lazy">` : ''}
                            </div>
                        `;
                    }

                    const isFunk = item.message.includes('[FUNK]');
                    const priorityClass = item.priority ? `priority-${item.priority}` : '';
                    let cleanMsg = item.message.replace('[FUNK]', '').replace('[TRANSFERLISTE]', '').replace('[IN_PROGRESS]', '').trim();
                    let imgHtml = '';
                    
                    if (item.image_url) {
                        imgHtml = `<br><img src="${item.image_url}" class="log-image" loading="lazy">`;
                    }
                    const urlRegex = /(https?:\/\/[^\s]+(?:jpg|jpeg|png|gif|webp))/ig;
                    if (cleanMsg.match(urlRegex)) {
                        const urls = cleanMsg.match(urlRegex);
                        for(let url of urls) {
                            imgHtml += `<br><img src="${url}" class="log-image" loading="lazy">`;
                            cleanMsg = cleanMsg.replace(url, `<a href="${url}" target="_blank" style="color:var(--primary-blue);">[Bild Link]</a>`);
                        }
                    }

                    return `
                        <div class="feed-item ${priorityClass}">
                            <div style="display: flex; justify-content: space-between; margin-bottom: 0.5rem;">
                                <strong>${item.author || 'System'} ${isFunk ? '📡' : '📝'}</strong>
                                <span class="feed-time">${formatTime(item.created_at)}</span>
                            </div>
                            <div style="font-size: 0.95rem; white-space: pre-wrap;">${cleanMsg}</div>
                            ${imgHtml}
                        </div>
                    `;
                }).join('');

            } catch (err) {
                list.innerHTML = `<div class="empty-state" style="border-color: #e74c3c; color: #ff8a80;">Fehler beim Laden des Archivs: ${err.message}</div>`;
            }
        }
    </script>
</body>
</html>
